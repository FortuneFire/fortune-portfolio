
<div class="dashboard-layout">
  <aside class="dashboard-sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark"><mat-icon>dashboard</mat-icon></span>
      <span>
        <strong>Fortune</strong>
        <small>Portfolio Studio</small>
      </span>
    </div>

    <label class="sidebar-search" for="dashboard-search">
      <mat-icon aria-hidden="true">search</mat-icon>
      <input id="dashboard-search" type="search" placeholder="Search" aria-label="Search dashboard">
    </label>

    <nav class="sidebar-nav" aria-label="Dashboard navigation">
      <section class="nav-group">
        <p class="nav-label">Dashboard</p>
        <a mat-button class="nav-link" routerLink="/dashboard"
           routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
          <mat-icon>space_dashboard</mat-icon>
          <span>Overview</span>
        </a>
        <a mat-button class="nav-link" routerLink="/dashboard/manage"
           routerLinkActive="active">
          <mat-icon>folder_copy</mat-icon>
          <span>Manage Projects</span>
        </a>
        <a mat-button class="nav-link" routerLink="/dashboard/add"
           routerLinkActive="active">
          <mat-icon>add_box</mat-icon>
          <span>Add Project</span>
        </a>
        <button mat-button class="nav-link nav-control" type="button" disabled>
          <mat-icon>account_circle</mat-icon>
          <span>Users</span>
          <span class="coming-soon">Soon</span>
        </button>
        <button mat-button class="nav-link nav-control" type="button" disabled>
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
          <span class="coming-soon">Soon</span>
        </button>
      </section>

      <section class="nav-group external-group">
        <p class="nav-label">External Pages</p>
        <a mat-button class="nav-link external-link" routerLink="/portfolio">
          <mat-icon>public</mat-icon>
          <span>Portfolio</span>
          <mat-icon class="external-icon">open_in_new</mat-icon>
        </a>
        <a mat-button class="nav-link external-link" routerLink="/">
          <mat-icon>home</mat-icon>
          <span>Back to Home</span>
          <mat-icon class="external-icon">open_in_new</mat-icon>
        </a>
      </section>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span>Workspace online</span>
    </div>
  </aside>

  <main class="dashboard-content">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="container">

  <h2 class="page-title">Projects</h2>
  <hr />

  <section class="portfolio-tab">
    <ul id="filters" class="clearfix" *ngIf="!selectedCard">
      <li
        class="filter"
        [class.active]="selectedFilter === project_category"
        *ngFor="let project_category of project_filter_categories"
        (click)="onCategoryClick(project_category)">
        {{ project_category }}
      </li>
    </ul>

    <button class="back-to-cards" *ngIf="selectedCard" (click)="backToCards()">
      Back to Projects
    </button>
  </section>

  <hr />

  <section *ngIf="!selectedCard">
    <div class="card-container">
      <div class="card-wrapper" *ngFor="let project of filteredProjects">
        <div class="card" (click)="onCardClick(project)">
          <div class="front">
            <img
              class="profile-img"
              [src]="project.keyIMG || 'https://picsum.photos/300/300?random'"
              [alt]="project.title">
            <h2>{{ project.title }}</h2>
            <p>{{ project.highlight }}</p>
          </div>
          <div class="back">
            <h2>Description</h2>
            <!-- <p class="project-description description">{{ project.description }}</p> -->
            <p [innerHTML]="renderMarkdown(project.description)" class="project-description"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="cardView" *ngIf="selectedCard">
    <h2 class="project-title">{{ selectedCard.title }}</h2>
    <div class="cardView-body">
      <div class="project-details">
        <h3>Project Description</h3>
        <!-- <p class="project-description">{{ selectedCard.description }}</p> -->
        <p [innerHTML]="renderMarkdown(selectedCard.description)" class="project-description"></p>

        <h3>Skills Used</h3>
        <ul class="skills">
          <li class="skill" *ngFor="let skill of selectedCard.skills">{{ skill }}</li>
        </ul>

        <h3>Categories</h3>
        <ul class="categories">
          <li *ngFor="let cat of selectedCard.categories">{{ cat }}</li>
        </ul>
      </div>

      <div class="project-images" *ngIf="selectedCard.gallery && selectedCard.gallery.length > 0">
        <h3>Project Images</h3>
        <div class="gallery-wrapper">
          <button class="scroll-btn left" (click)="scrollLeft()">&#10094;</button>
          <div class="gallery" #gallery>
            <img
              *ngFor="let img of selectedCard.gallery; let i = index"
              [src]="img || 'https://picsum.photos/200/150?random'"
              [alt]="selectedCard.title + ' screenshot'"
              loading="lazy"
              (click)="openLightbox(i)">
          </div>
          <button class="scroll-btn right" (click)="scrollRight()">&#10095;</button>
        </div>
      </div>
    </div>
  </section>

  <div *ngIf="projects.length === 0">
    <p>No projects to display.</p>
  </div>

  <div class="lightbox" *ngIf="lightboxOpen">
    <div class="lightbox-overlay" (click)="closeLightbox()"></div>
    <div class="lightbox-content">
      <button class="close-btn" (click)="closeLightbox()">&#10006;</button>
      <button class="nav-btn left" (click)="prevImage()">&#10094;</button>
      <img [src]="selectedLightboxImage" [alt]="selectedCard?.title">
      <button class="nav-btn right" (click)="nextImage()">&#10095;</button>
    </div>
  </div>

</div>

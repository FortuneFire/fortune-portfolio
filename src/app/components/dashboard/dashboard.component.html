<div class="dashboard-container">
  <nav class="dashboard-nav">
    <button (click)="toggleView('add')" [class.active]="showAddProject">
      Add New Project
    </button>
    <button (click)="toggleView('manage')" [class.active]="showManageProjects">
      Edit / Delete Projects
    </button>
  </nav>

  <hr />

  <div class="view-content">

    <app-project-form *ngIf="showAddProject"></app-project-form>

    <app-manage-projects *ngIf="showManageProjects" (editRequested)="handleEditRequest()">
    </app-manage-projects>

  </div>
</div>

<div class="dashboard-container">
  <nav class="dashboard-nav">
    <button (click)="toggleView('add')" [class.active]="showAddProject">
      Add New Project
    </button>
    <button (click)="toggleView('manage')" [class.active]="showManageProjects">
      Manage Projects
    </button>
  </nav>

  <hr />

  <!-- Conditional rendering -->
  <div *ngIf="showAddProject">
    <app-project-form *ngIf="showAddProject"></app-project-form>
  </div>

  <div *ngIf="showManageProjects">
    <app-manage-projects *ngIf="showManageProjects"></app-manage-projects>
  </div>
</div>

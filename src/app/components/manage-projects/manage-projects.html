<div class="manage-container">
  <h3>Current Projects</h3>

  <div class="project-list">

    <!-- PROJECT LIST -->
    <div class="project-item"
         *ngFor="let project of projects"
         [class.editing]="selectedProject?.id === project.id">

      <!-- MAIN INFO ROW -->
      <div class="project-main-info">
        <div class="thumbnail">
          <img [src]="project.keyIMG || 'https://picsum.photos/60?random'" 
               [alt]="project.title">
        </div>

        <div class="info">
          <strong>{{ project.title }}</strong>
          <span>{{ project.categories.join(', ') }}</span>
        </div>

        <!-- ACTION BUTTONS (hidden while editing this project) -->
        <div class="actions" *ngIf="selectedProject?.id !== project.id">
          <button class="btn-edit" (click)="editProject(project)">Edit</button>
          <button class="btn-delete" (click)="deleteProject(project.id)">Delete</button>
        </div>
      </div>

      <!-- EDIT FORM -->
      <div class="edit-form" *ngIf="selectedProject?.id === project.id">

        <form [formGroup]="projectForm" (ngSubmit)="saveProject()">

          <label>Title</label>
          <input formControlName="title">

          <label>Highlight</label>
          <input formControlName="highlight">

          <label>Description</label>
          <textarea formControlName="description"></textarea>

          <!-- CATEGORIES -->
          <label>Categories</label>
          <div class="form-array">
            <span *ngFor="let cat of categories.controls; let i = index">
              {{ cat.value }}
              <button type="button" (click)="categories.removeAt(i)">×</button>
            </span>

            <input #newCat placeholder="Add category">
            <button type="button"
                    (click)="addCategory(newCat.value); newCat.value=''">
              Add
            </button>
          </div>

          <!-- SKILLS -->
          <label>Skills</label>
          <div class="form-array">
            <span *ngFor="let skill of skills.controls; let i = index">
              {{ skill.value }}
              <button type="button" (click)="skills.removeAt(i)">×</button>
            </span>

            <input #newSkill placeholder="Add skill">
            <button type="button"
                    (click)="addSkill(newSkill.value); newSkill.value=''">
              Add
            </button>
          </div>

          <!-- KEY IMAGE UPLOAD -->
          <label>Main Project Image</label>
          <input type="file" (change)="onKeyImageSelected($event)">

          <div class="preview" *ngIf="keyImagePreview">
            <img [src]="keyImagePreview" alt="Key Image Preview">
          </div>

          <!-- GALLERY SECTION -->
          <label>Gallery Images</label>

          <div class="gallery">

            <!-- Existing Gallery Images -->
            <div class="gallery-item"
                 *ngFor="let img of gallery.controls; let i = index">

              <img [src]="img.value"
                   [alt]="project.title + ' image ' + (i+1)">

              <button type="button"
                      (click)="removeGalleryImage(i)">
                ×
              </button>
            </div>

            <!-- Upload new gallery images -->
            <input type="file"
                   multiple
                   (change)="onGallerySelected($event)">

            <div class="upload-info" *ngIf="galleryFiles.length">
              {{ galleryFiles.length }} new image(s) selected
            </div>

          </div>

          <!-- ACTION BUTTONS -->
          <div class="form-actions">
            <button type="submit" [disabled]="isUploading">
              {{ isUploading ? 'Saving...' : 'Save Changes' }}
            </button>

            <button type="button" (click)="cancelEdit()">
              Cancel
            </button>
          </div>

        </form>

      </div>
      <!-- END EDIT FORM -->

    </div>
    <!-- END PROJECT ITEM -->

    <div *ngIf="projects.length === 0" class="no-data">
      No projects found in database.
    </div>

  </div>
</div>

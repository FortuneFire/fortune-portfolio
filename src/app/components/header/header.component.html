<!-- ===============================
     DESKTOP NAV
================================ -->
<div class="nav-wrapper desktop-nav">
  <nav>

    <!-- LOGO -->
    <a routerLink="/" class="logo">
      <img src="../../../assets/images/logo.png" alt="logo">
    </a>

    <!-- DESKTOP ACTIONS -->
    <div class="navLinks">

      <a routerLink="/contact">
        <button type="button" class="btn primary nav-btn">
          Let's Chat
        </button>
      </a>

      <!-- LOGGED IN -->
      <div *ngIf="isLoggedIn$ | async; else loginBtn" class="auth-actions">

        <a routerLink="/dashboard">
          <button class="btn primary nav-btn">
            Manage Projects
          </button>
        </a>

        <button
          (click)="logout()"
          class="btn secondary nav-btn sign-out-btn">
          Sign Out
        </button>

      </div>

      <!-- LOGGED OUT -->
      <ng-template #loginBtn>
        <a routerLink="/sign-in">
          <button class="btn secondary nav-btn sign-in-btn">
            Sign In
          </button>
        </a>
      </ng-template>

    </div>

  </nav>
</div>


<!-- ===============================
     MOBILE NAV
================================ -->
<div class="mobile-nav-wrapper">

  <div class="mobile-nav-bar">
    <a routerLink="/contact" class="mobile-cta" (click)="closeMobileNav()">
      <span>Let's Chat</span>
      <span class="mobile-cta-arrow" aria-hidden="true">&#8594;</span>
    </a>

    <button class="nav-toggle" type="button" (click)="toggleMobileNav()" aria-label="Toggle navigation menu">
      <span [class.open]="mobileNavOpen">&#10094;</span>
    </button>

  </div>

  <!-- DRAWER -->
  <div class="mobile-drawer" [class.open]="mobileNavOpen">

    <a routerLink="/contact" (click)="closeMobileNav()">
      <button type="button" class="btn primary nav-btn">
        Let's Chat
      </button>
    </a>

    <!-- LOGGED IN -->
    <ng-container *ngIf="isLoggedIn$ | async; else mobileLogin">

      <a routerLink="/dashboard" (click)="closeMobileNav()">
        <button class="btn primary nav-btn">
          Manage Projects
        </button>
      </a>

      <button
        (click)="logout(); closeMobileNav()"
        class="btn secondary nav-btn sign-out-btn">
        Sign Out
      </button>

    </ng-container>

    <!-- LOGGED OUT -->
    <ng-template #mobileLogin>

      <a routerLink="/sign-in" (click)="closeMobileNav()">
        <button class="btn secondary nav-btn sign-in-btn">
          Sign In
        </button>
      </a>

    </ng-template>

  </div>

</div>
